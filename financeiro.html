<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<meta http-equiv="Pragma" content="no-cache"/>
<meta http-equiv="Expires" content="0"/>
<title>Financeiro — Escritório</title>
<script>
(function loadAppCss(){
  const isLocalServer = ['localhost', '127.0.0.1'].includes(location.hostname);
  const cssPath = location.protocol === 'file:' || isLocalServer
    ? 'financeiro.css?v=2.5.99'
    : '/Skala-F/financeiro.css?v=2.5.99';
  document.write('<link rel="stylesheet" href="' + cssPath + '"/>');
})();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <div class="login-ico"><span data-app-icon="chart"></span></div>
    <div class="login-title">Financeiro</div>
    <div class="login-sub">Escritório — Acesso restrito</div>
    <div class="login-field" style="margin-bottom:8px">
      <input id="login-email" type="email" placeholder="E-mail" autocomplete="username" style="letter-spacing:0" onkeydown="if(event.key==='Enter')document.getElementById('login-pass').focus()"/>
    </div>
    <div class="login-field">
      <input id="login-pass" type="password" placeholder="Senha" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"/>
    </div>
    <button class="login-btn" onclick="doLogin()">Entrar</button>
    <div class="login-err" id="login-err"></div>
  </div>
</div>
<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <img src="img/logo.png" alt="Skala Contabilidade" style="width:100%;max-width:140px;display:block;margin:0 auto 4px"/>
      <div style="text-align:center"><div class="brand-sub" style="color:var(--tx3);font-size:10px;letter-spacing:.05em">Financeiro — Escritório <span id="app-ver"></span></div></div>
    </div>
    <nav id="nav"></nav>
    <div class="sidebar-foot">
      <div class="sync-status"><div class="sync-dot" id="sync-dot"></div><span id="sync-txt">Conectando...</span></div>
      <button class="btn-exp" onclick="doLogout()" style="color:var(--red);border-color:rgba(248,81,73,.3)"><span data-app-icon="lock"></span>Sair</button>
      <button class="btn-exp" onclick="exportExcel()"><span data-app-icon="download"></span>Exportar Excel</button>
      <button class="btn-exp" onclick="document.getElementById('imp-fat-file').click()"><span data-app-icon="upload"></span>Importar Faturamento</button>
      <input type="file" id="imp-fat-file" accept=".csv,.xls,.xlsx" style="display:none" onchange="onImpFatChange(event)">
      <button class="btn-exp" onclick="openBaixarRelModal()"><span data-app-icon="clipboard"></span>Baixar por Relatório</button>
    </div>
  </aside>
  <main id="main">
    <header class="topbar">
      <div><h1 class="page-ttl" id="page-ttl">Dashboard</h1></div>
      <div class="topbar-r">
        <div class="yr-sel"><select id="yr-sel" onchange="setYear(this.value)"></select></div>
        <button class="btn btn-ghost" onclick="openTransfModal()" style="font-size:13px"><span data-app-icon="transfer"></span>Transferência</button>
        <button class="btn btn-pri" onclick="openForm()"><span data-app-icon="plus"></span>Novo Lançamento</button>
      </div>
    </header>
    <div class="content" id="content"></div>
  </main>
</div>
<div class="overlay" id="baixar-rel-overlay" style="display:none" onclick="if(event.target===this)closeBaixarRelModal()">
  <div class="modal" style="max-width:920px">
    <div class="modal-hdr"><h2><span data-app-icon="download"></span>Baixar por Relatório de Recebimentos</h2><button class="cls" onclick="closeBaixarRelModal()">✕</button></div>
    <div id="baixar-rel-body" style="padding:18px 22px"></div>
  </div>
</div>
<div class="overlay" id="imp-overlay" style="display:none" onclick="if(event.target===this)closeImpModal()">
  <div class="modal" style="max-width:92vw;width:92vw;max-height:90vh">
    <div class="modal-hdr"><h2>Importar Faturamento</h2><button class="cls" onclick="closeImpModal()">✕</button></div>
    <div id="imp-body" style="padding:18px 22px"></div>
  </div>
</div>
<div class="overlay" id="overlay" style="display:none">
  <div class="modal modal-lancamento"><div class="modal-hdr"><div style="display:flex;align-items:center;gap:10px"><h2 id="modal-ttl">Novo Lançamento</h2><span id="modal-seq" style="font-size:12px;font-weight:600;color:var(--tx2);background:var(--s2);border:1px solid var(--bd);border-radius:6px;padding:2px 8px;display:none"></span></div><button class="cls" onclick="closeForm()">✕</button></div><div class="fgrid" id="fgrid"></div><div class="fa modal-footer-btns" id="modal-footer"></div></div>
</div>
<div class="overlay" id="parcial-overlay" style="display:none" onclick="if(event.target===this)closeParcialModal()">
  <div class="modal" style="max-width:580px">
    <div class="modal-hdr"><h2><span data-app-icon="wallet"></span>Pagamento Parcial</h2><button class="cls" onclick="closeParcialModal()">✕</button></div>
    <div id="parcial-body" style="padding:18px 22px"></div>
  </div>
</div>
<div class="overlay" id="transf-overlay" style="display:none" onclick="if(event.target===this)closeTransfModal()">
  <div class="modal" style="max-width:500px">
    <div class="modal-hdr"><h2><span data-app-icon="transfer"></span>Nova Transferência</h2><button class="cls" onclick="closeTransfModal()">✕</button></div>
    <div id="transf-body" style="padding:20px 24px"></div>
  </div>
</div>
<script>
(function loadAppJs(){
  const isLocalServer = ['localhost', '127.0.0.1'].includes(location.hostname);
  const basePath = location.protocol === 'file:' || isLocalServer ? 'js/' : '/Skala-F/js/';
  [
    '01-core.js',
    '02-relatorios.js',
    '03-lancamentos.js',
    '04-cadastros.js',
    '05-importacoes.js'
  ].forEach(function(file){
    document.write('<script src="' + basePath + file + '?v=2.5.99"><\/script>');
  });
})();
</script>
</body>
</html>
