<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<meta http-equiv="Pragma" content="no-cache"/>
<meta http-equiv="Expires" content="0"/>
<title>Financeiro — Escritório</title>
<script>
(function loadAppCss(){
  const isLocalServer = ['localhost', '127.0.0.1'].includes(location.hostname);
  const cssPath = location.protocol === 'file:' || isLocalServer
    ? 'financeiro.css?v=2.5.165'
    : '/Skala-F/financeiro.css?v=2.5.165';
  document.write('<link rel="stylesheet" href="' + cssPath + '"/>');
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body>

<div id="login-screen">
  <div class="login-box">
    <div class="login-ico"><span data-app-icon="chart"></span></div>
    <div class="login-title">Financeiro</div>
    <div class="login-sub">Escritório — Acesso restrito</div>
    <div class="login-field" style="margin-bottom:8px">
      <input id="login-email" type="email" placeholder="E-mail" autocomplete="username" style="letter-spacing:0" onkeydown="if(event.key==='Enter')document.getElementById('login-pass').focus()"/>
    </div>
    <div class="login-field">
      <input id="login-pass" type="password" placeholder="Senha" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"/>
    </div>
    <button class="login-btn" onclick="doLogin()">Entrar</button>
    <div class="login-err" id="login-err"></div>
  </div>
</div>
<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <img src="img/logo-icon.png" alt="Skala" class="brand-logo-icon"/>
      <span id="app-ver" style="display:none"></span>
      <button class="sb-toggle" id="sb-toggle" onclick="toggleSidebar()" title="Recolher menu">«</button>
    </div>
    <nav id="nav"></nav>
    <div class="sidebar-foot">
      <div id="pf-options" class="pf-options">
        <button onclick="openSettingsModal()"><span data-app-icon="settings"></span>Configurações</button>
        <button onclick="openLogPanel()"><span data-app-icon="activity"></span>Log de Eventos</button>
        <button onclick="doLogout()" class="pf-logout">→ Sair</button>
      </div>
      <div id="profile-area" class="profile-area" onclick="toggleProfileDropdown(event)">
        <div class="pf-avatar" id="pf-avatar">?</div>
        <div class="pf-info">
          <div class="pf-name" id="pf-name">Carregando...</div>
          <div class="pf-role" id="pf-role" style="display:none"></div>
        </div>
        <span class="pf-chevron" id="pf-chevron">▾</span>
      </div>
      <div class="sync-status"><div class="sync-dot" id="sync-dot"></div><span id="sync-txt">Conectando...</span></div>
      <input type="file" id="imp-fat-file" accept=".csv,.xls,.xlsx" style="display:none" onchange="onImpFatChange(event)">
    </div>
  </aside>
  <main id="main">
    <header class="topbar">
      <div><h1 class="page-ttl" id="page-ttl">Dashboard</h1><p class="page-sub" id="page-sub"></p></div>
      <div class="topbar-r">
        <div class="yr-sel" id="yr-sel-wrap">
          <button class="yr-sel-btn" id="yr-sel-btn" onclick="toggleMonthPicker()">—</button>
          <div class="yr-sel-panel" id="yr-sel-panel" style="display:none">
            <div class="yr-sel-nav">
              <button onclick="shiftPickerYear(-1)">◀</button>
              <span id="yr-sel-year"></span>
              <button onclick="shiftPickerYear(1)">▶</button>
            </div>
            <div class="yr-sel-grid" id="yr-sel-grid"></div>
            <div class="yr-sel-today"><button onclick="setPickerToday()">Hoje</button></div>
          </div>
        </div>
        <button id="global-eye" onclick="toggleOcultarValores()" title="Ocultar valores" class="btn btn-ghost" style="font-size:13px;padding:7px 10px;opacity:.5"><svg viewBox="0 0 24 24" style="width:16px;height:16px;stroke:currentColor;stroke-width:2;fill:none"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></button>
        <button class="btn btn-ghost" onclick="openTransfModal()" style="font-size:13px"><span data-app-icon="transfer"></span>Transferência</button>
        <button class="btn btn-pri" onclick="openForm()"><span data-app-icon="plus"></span>Novo Lançamento</button>
      </div>
    </header>
    <div class="content" id="content"></div>
  </main>
</div>
<div class="overlay" id="baixar-rel-overlay" style="display:none" onclick="if(event.target===this)closeBaixarRelModal()">
  <div class="modal" style="max-width:920px">
    <div class="modal-hdr"><h2><span data-app-icon="download"></span>Baixar por Relatório de Recebimentos</h2><button class="cls" onclick="closeBaixarRelModal()">✕</button></div>
    <div id="baixar-rel-body" style="padding:18px 22px"></div>
  </div>
</div>
<div class="overlay" id="imp-overlay" style="display:none" onclick="if(event.target===this)closeImpModal()">
  <div class="modal" style="max-width:92vw;width:92vw;max-height:90vh">
    <div class="modal-hdr"><h2>Importar Faturamento</h2><button class="cls" onclick="closeImpModal()">✕</button></div>
    <div id="imp-body" style="padding:18px 22px"></div>
  </div>
</div>
<div class="overlay" id="overlay" style="display:none" onkeydown="if(event.ctrlKey&&event.key==='Enter'){event.preventDefault();saveForm();}" onclick="if(event.target===this)closeForm()">
  <div class="modal modal-lancamento"><div class="modal-hdr"><div style="display:flex;align-items:center;gap:10px"><h2 id="modal-ttl">Novo Lançamento</h2><span id="modal-seq" style="font-size:12px;font-weight:600;color:var(--tx2);background:var(--s2);border:1px solid var(--bd);border-radius:6px;padding:2px 8px;display:none"></span></div><button class="cls" onclick="closeForm()">✕</button></div><div id="tipo-switch-wrap"></div><div id="draft-banner" style="display:none"></div><div class="fgrid" id="fgrid"></div><div class="fa modal-footer-btns" id="modal-footer"></div></div>
</div>
<div class="overlay" id="parcial-overlay" style="display:none" onclick="if(event.target===this)closeParcialModal()">
  <div class="modal" style="max-width:580px">
    <div class="modal-hdr"><h2 id="baixa-modal-title"><span data-app-icon="wallet"></span>Receber/Pagar</h2><button class="cls" onclick="closeParcialModal()">✕</button></div>
    <div id="parcial-body" style="padding:18px 22px"></div>
  </div>
</div>
<div class="overlay" id="transf-overlay" style="display:none" onclick="if(event.target===this)closeTransfModal()">
  <div class="modal" style="max-width:500px">
    <div class="modal-hdr"><h2><span data-app-icon="transfer"></span>Nova Transferência</h2><button class="cls" onclick="closeTransfModal()">✕</button></div>
    <div id="transf-body" style="padding:20px 24px"></div>
  </div>
</div>
<div class="overlay" id="cliente-overlay" style="display:none" onclick="if(event.target===this)closeClienteForm()">
  <div class="modal" style="max-width:520px">
    <div class="modal-hdr">
      <h2 id="cliente-modal-ttl"><span data-app-icon="clipboard"></span>Novo Cliente</h2>
      <button class="cls" onclick="closeClienteForm()">✕</button>
    </div>
    <div id="cliente-body" style="padding:18px 22px"></div>
  </div>
</div>
<div class="overlay" id="settings-overlay" style="display:none" onclick="if(event.target===this)closeSettingsModal()">
  <div class="modal" style="max-width:480px">
    <div class="modal-hdr">
      <h2><span data-app-icon="settings"></span>Configurações da Conta</h2>
      <button class="cls" onclick="closeSettingsModal()">✕</button>
    </div>
    <div style="padding:22px 24px">
      <div class="form-sec-hdr" style="grid-column:unset;margin-bottom:14px">PERFIL</div>
      <div style="margin-bottom:10px"><label style="display:block;font-size:12px;font-weight:600;color:var(--tx2);margin-bottom:4px">Nome</label><input id="cfg-name" type="text" style="width:100%;box-sizing:border-box;padding:8px 10px" placeholder="Seu nome completo"></div>
      <div style="margin-bottom:16px"><label style="display:block;font-size:12px;font-weight:600;color:var(--tx2);margin-bottom:4px">E-mail</label><input id="cfg-email" type="email" style="width:100%;box-sizing:border-box;padding:8px 10px" placeholder="seu@email.com"></div>
      <button class="btn btn-pri" style="font-size:13px" onclick="saveProfile()">Salvar alterações</button>
      <div class="form-sec-hdr" style="grid-column:unset;margin-top:28px;margin-bottom:14px">SEGURANÇA</div>
      <div style="margin-bottom:10px"><label style="display:block;font-size:12px;font-weight:600;color:var(--tx2);margin-bottom:4px">Senha atual</label><input id="cfg-pass-cur" type="password" style="width:100%;box-sizing:border-box;padding:8px 10px" placeholder="••••••••"></div>
      <div style="margin-bottom:10px"><label style="display:block;font-size:12px;font-weight:600;color:var(--tx2);margin-bottom:4px">Nova senha</label><input id="cfg-pass-new" type="password" style="width:100%;box-sizing:border-box;padding:8px 10px" placeholder="••••••••" oninput="checkPassMatch()"></div>
      <div style="margin-bottom:6px"><label style="display:block;font-size:12px;font-weight:600;color:var(--tx2);margin-bottom:4px">Confirmar nova senha</label><input id="cfg-pass-conf" type="password" style="width:100%;box-sizing:border-box;padding:8px 10px" placeholder="••••••••" oninput="checkPassMatch()"></div>
      <div id="cfg-pass-err" style="color:var(--red);font-size:12px;margin-bottom:12px;display:none"></div>
      <button class="btn btn-ghost" style="font-size:13px" onclick="changePassword()">Alterar senha</button>
    </div>
    <div class="modal-footer-btns" style="padding:14px 24px;border-top:1px solid var(--bd);display:flex;justify-content:flex-end">
      <button class="btn btn-ghost" onclick="closeSettingsModal()">Fechar</button>
    </div>
  </div>
</div>
<div class="overlay" id="log-panel" style="display:none" onclick="if(event.target===this)closeLogPanel()">
  <div class="modal" style="max-width:500px;max-height:70vh;display:flex;flex-direction:column">
    <div class="modal-hdr"><h2><span data-app-icon="activity"></span>Log de Eventos</h2><button class="cls" onclick="closeLogPanel()">✕</button></div>
    <div id="log-panel-body" style="padding:0 22px 4px;overflow-y:auto;flex:1;min-height:80px"></div>
    <div style="padding:12px 22px;border-top:1px solid var(--bd);display:flex;justify-content:flex-end">
      <button class="btn btn-ghost" style="font-size:12px" onclick="TOAST_LOG.length=0;document.getElementById('log-panel-body').innerHTML='<div style=&quot;padding:24px 0;text-align:center;color:var(--tx3);font-size:13px&quot;>Log limpo.</div>'">Limpar log</button>
    </div>
  </div>
</div>
<div id="float-tip" style="position:fixed;z-index:9999;background:var(--tx);color:var(--bg);font-size:11.5px;font-weight:500;line-height:1.5;padding:7px 11px;border-radius:8px;width:220px;white-space:normal;box-shadow:0 4px 16px rgba(0,0,0,.25);display:none;pointer-events:none"></div>
<div class="overlay" id="confirm-overlay" style="display:none" onclick="if(event.target===this)_cfmClose(false)">
  <div class="modal" style="max-width:420px">
    <div class="modal-hdr"><h2 id="confirm-title">Confirmar</h2><button class="cls" onclick="_cfmClose(false)">✕</button></div>
    <div id="confirm-body" style="padding:18px 22px 8px;font-size:14px;color:var(--tx2);line-height:1.6"></div>
    <div style="padding:12px 22px 18px;display:flex;justify-content:flex-end;gap:8px">
      <button class="btn btn-ghost" id="confirm-cancel-btn" onclick="_cfmClose(false)">Cancelar</button>
      <button class="btn btn-pri" id="confirm-ok-btn" onclick="_cfmClose(true)">Confirmar</button>
    </div>
  </div>
</div>
<script>
(function loadAppJs(){
  const isLocalServer = ['localhost', '127.0.0.1'].includes(location.hostname);
  const basePath = location.protocol === 'file:' || isLocalServer ? 'js/' : '/Skala-F/js/';
  [
    '00-config.js',
    '01-core.js',
    '02-relatorios.js',
    '03-lancamentos.js',
    '04-cadastros.js',
    '05-importacoes.js',
    '06-clientes.js'
  ].forEach(function(file){
    document.write('<script src="' + basePath + file + '?v=2.5.182"><\/script>');
  });
})();
</script>
</body>
</html>
